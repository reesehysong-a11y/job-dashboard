name: Deploy JobFlow to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # 30분마다 네이버 환율 자동 업데이트 및 Pages 배포

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Naver Exchange Rates
        run: |
          python -c "
          import urllib.request, json, datetime
          headers = {'User-Agent': 'Mozilla/5.0'}
          usd, jpy = 1347.40, 8.5323
          try:
              req_u = urllib.request.Request('https://api.stock.naver.com/marketindex/exchange/FX_USDKRW', headers=headers)
              d_u = json.loads(urllib.request.urlopen(req_u, timeout=7).read().decode('utf-8'))
              usd = float(d_u['exchangeInfo']['calcPrice'].replace(',', ''))
          except Exception as e:
              print('Naver USD error:', e)
          try:
              req_j = urllib.request.Request('https://api.stock.naver.com/marketindex/exchange/FX_JPYKRW', headers=headers)
              d_j = json.loads(urllib.request.urlopen(req_j, timeout=7).read().decode('utf-8'))
              jpy = float(d_j['exchangeInfo']['calcPrice'].replace(',', '')) / 100.0
          except Exception as e:
              print('Naver JPY error:', e)
          
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST')
          fx_data = {
              'usd': usd,
              'jpy': jpy,
              'updatedAt': now,
              'source': '네이버 증권 고시 환율 (하나은행 기준)',
              'sourceUrl': 'https://m.stock.naver.com/marketindex/exchange/FX_USDKRW'
          }
          with open('naver_fx.json', 'w', encoding='utf-8') as f:
              json.dump(fx_data, f, ensure_ascii=False, indent=2)
          print('Successfully updated naver_fx.json:', fx_data)
          "

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
