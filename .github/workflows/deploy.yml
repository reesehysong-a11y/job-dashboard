name: Deploy JobFlow & Daily 9AM Job-ALIO Sync

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'    # 매일 아침 09:00 KST (UTC 00:00) 잡알리오 맞춤 공고 자동 수집 & 대시보드 반영
    - cron: '*/30 * * * *' # 30분마다 네이버 환율 자동 업데이트 및 Pages 배포

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Job-ALIO Custom Postings (Daily 9AM KST, Push & Manual Run)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
        run: |
          pip install requests beautifulsoup4
          python sync_jobalio.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobalio_auto.json cloud_data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync Job-ALIO postings (9AM KST)"
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Fetch Latest Naver Exchange Rates
        run: |
          python -c "
          import urllib.request, json, datetime
          headers = {'User-Agent': 'Mozilla/5.0'}
          usd, jpy = 1347.40, 8.5323
          try:
              req_u = urllib.request.Request('https://api.stock.naver.com/marketindex/exchange/FX_USDKRW', headers=headers)
              d_u = json.loads(urllib.request.urlopen(req_u, timeout=7).read().decode('utf-8'))
              usd = float(d_u['exchangeInfo']['calcPrice'].replace(',', ''))
          except Exception as e:
              print('Naver USD error:', e)
          try:
              req_j = urllib.request.Request('https://api.stock.naver.com/marketindex/exchange/FX_JPYKRW', headers=headers)
              d_j = json.loads(urllib.request.urlopen(req_j, timeout=7).read().decode('utf-8'))
              jpy = float(d_j['exchangeInfo']['calcPrice'].replace(',', '')) / 100.0
          except Exception as e:
              print('Naver JPY error:', e)
          
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST')
          fx_data = {
              'usd': usd,
              'jpy': jpy,
              'updatedAt': now,
              'source': '네이버 증권 고시 환율 (하나은행 기준)',
              'sourceUrl': 'https://m.stock.naver.com/marketindex/exchange/FX_USDKRW'
          }
          with open('naver_fx.json', 'w', encoding='utf-8') as f:
              json.dump(fx_data, f, ensure_ascii=False, indent=2)
          print('Successfully updated naver_fx.json:', fx_data)
          "

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
